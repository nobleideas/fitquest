
<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0B0E15">
  <meta name="apple-mobile-web-app-title" content="FitQuest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>FitQuest</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- Load video compression before Flutter -->
  <script src="fitquest_video_compressor.js"></script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async function () {
        try {
          const reg = await navigator.serviceWorker.register(
            "firebase-messaging-sw.js"
          );
          console.log(
            "✅ firebase-messaging-sw.js registered:",
            reg.scope
          );
        } catch (e) {
          console.error(
            "❌ Service worker registration failed:",
            e
          );
        }
      });
    }
  </script>

  <script src="fitquest_nutrition_scanner.js"></script>
</body>
</html>
